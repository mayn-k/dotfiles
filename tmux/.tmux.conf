set -sg escape-time 0
# ~/.tmux.conf
# Managed by dotfiles repo. Edit the repo version, then: stow -R tmux

# ─── Core ────────────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set -g prefix C-s
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g status-position top

# True color in alacritty / foot / wezterm
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",alacritty:Tc"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set-option -g default-shell /usr/bin/zsh

# New windows/panes inherit the working directory
bind c new-window          -c "#{pane_current_path}"
bind '"' split-window -v   -c "#{pane_current_path}"
bind % split-window -h     -c "#{pane_current_path}"

# vim-tmux-navigator handles C-h/j/k/l for cross-pane-and-vim-window navigation.
# The plain h/j/k/l bindings below are for pane selection WITHIN tmux only,
# triggered explicitly via prefix.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# fzf-backed tmux sessionizer
bind-key -r f run-shell "tmux new ~/.local/bin/tmux-sessionizer"

# ─── Plugins (tpm) ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'

set -g @rose_pine_variant 'moon'
set -g @rose_pine_directory 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_bar_bg_disable 'on'

# ─── Initialize tpm (MUST be near the bottom) ───────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# ─── Embed workflow bindings (sourced AFTER tpm so they override plugin keys)
# Location is configurable via EMBED_WORKFLOW_DIR; defaults to the repo path.
if-shell '[ -f ~/work/embedded_systems/embed-workflow/tmux/embed.tmux.conf ]' \
    'source-file ~/work/embedded_systems/embed-workflow/tmux/embed.tmux.conf'

# Added by embed-workflow installer
source-file /home/mayn_k/work/embedded_systems/embed-workflow/tmux/embed.tmux.conf
